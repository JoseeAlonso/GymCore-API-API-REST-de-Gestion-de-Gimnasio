spring.application.name=gimnasio

# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:gimnasiodb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2 para ver los datos
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Que Hibernate cree las tablas automáticamente según las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuración de codificación UTF-8 en la respuesta HTTP de Spring
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true
